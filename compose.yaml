services:
  apache:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./public:/var/www/html:ro
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./public:/var/www/html:ro
      - ./app:/var/www/app:ro
      - sqlite-data:/var/lib/app

volumes:
  sqlite-data:
